name: Daily Content Generation

on:
  schedule:
    # 7:00 AM ET = 11:00 AM UTC
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of blog posts to generate'
        required: false
        default: '5'

jobs:
  generate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run daily content script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '5' }}
        run: node scripts/generate-daily-content.mjs

      - name: Validate content schema
        run: node scripts/validate-content-schema.mjs

      - name: Commit generated content
        run: |
          git config user.name "BayShine Content Bot"
          git config user.email "content-bot@bayshine.net"
          git add src/content/blog/ src/content/fieldGuideScenarios/
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "feat(content): daily auto-generated content $(date +%Y-%m-%d)"

      - name: Push changes
        id: push
        run: |
          PUSHED_SHA=$(git rev-parse HEAD)
          FILES_CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^(src/content/blog/|src/content/fieldGuideScenarios/)' | wc -l || echo "0")
          git push origin main
          {
            echo "sha=$PUSHED_SHA"
            echo "short_sha=${PUSHED_SHA:0:7}"
            echo "files_changed=$FILES_CHANGED"
          } >> "$GITHUB_OUTPUT"

      - name: Notify success
        if: success()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: BayShine Automation <${{ secrets.GMAIL_USER }}>
          to: constantine@bayshine.net
          subject: "[BayShine automation] Daily content posted - ${{ steps.push.outputs.short_sha }}"
          body: |
            Daily content generation completed successfully.

            Commit: ${{ steps.push.outputs.sha }}
            Content files changed: ${{ steps.push.outputs.files_changed }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Vercel deploy will be triggered by this push and should land within 5 minutes.

      - name: Notify failure
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: BayShine Automation <${{ secrets.GMAIL_USER }}>
          to: constantine@bayshine.net
          subject: "[BayShine automation] FAILED - daily content run"
          body: |
            Daily content generation FAILED.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit at start: ${{ github.sha }}

            Review the workflow logs for the failed step. Common causes:
            - Anthropic API quota/rate limit
            - Schema validation rejected new content
            - Git push rejected (concurrent commit)
