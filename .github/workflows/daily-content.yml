name: Daily Content Generation

on:
  schedule:
    # 7:00 AM ET = 11:00 AM UTC
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of blog posts to generate'
        required: false
        default: '5'

jobs:
  generate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run daily content script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '5' }}
        run: node scripts/generate-daily-content.mjs

      - name: Validate content schema
        run: node scripts/validate-content-schema.mjs

      - name: Commit generated content
        run: |
          git config user.name "BayShine Content Bot"
          git config user.email "content-bot@bayshine.net"
          git add src/content/blog/ src/content/fieldGuideScenarios/
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "feat(content): daily auto-generated content $(date +%Y-%m-%d)"

      - name: Push changes
        run: git push origin main
